# AnsiRover reusable Nginx guard for Directus collections ending in _uuidgetset.
# Contract:
#   POST    /items/<collection>_uuidgetset
#   GET     /items/<collection>_uuidgetset/<uuid-v4>
#   PATCH   /items/<collection>_uuidgetset/<uuid-v4>
#   OPTIONS on both shapes for CORS preflight.
# Collection listing, filters through collection GET, bulk mutation, DELETE,
# malformed IDs, blank IDs, and sequential IDs are rejected at ingress.

location ~ "^/items/[A-Za-z0-9_]+_uuidgetset$" {
    if ($request_method !~ ^(POST|OPTIONS)$) {
        return 404;
    }

    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ "^/items/[A-Za-z0-9_]+_uuidgetset/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" {
    if ($request_method !~ ^(GET|PATCH|OPTIONS)$) {
        return 404;
    }

    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ "^/items/[A-Za-z0-9_]+_uuidgetset(?:/|$)" {
    return 404;
}
