name: Temporary env var template validation

on:
  pull_request:
    branches:
      - ci/env-var-template-expansion

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
